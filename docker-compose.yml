services:
  postgres:
    image: postgres:16-alpine
    container_name: syncproof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-syncproof_db}
      POSTGRES_USER: ${DB_USER:-syncproof_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-syncproof_dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - syncproof_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-syncproof_user} -d ${DB_NAME:-syncproof_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  syncproof_pgdata:
    driver: local
